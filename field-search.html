<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Field Availability Search</title>

  <!-- New external stylesheet -->
  <link rel="stylesheet" href="field-search.css" />
</head>

<body>

  <div id="layout">

    <!-- ========================= -->
    <!-- LEFT SIDEBAR (450px)      -->
    <!-- ========================= -->
    <aside id="sidebar">

      <h1 class="page-title">Find Field Availability</h1>

      <div class="form-section">

        <label>
          Complex:
          <select id="complexSelect">
            <option value="">Any</option>
            <option value="SUMNER/SEAN JOYCE">Sumner / Sean Joyce</option>
            <option value="TURF">Turf</option>
            <option value="AVON BUTLER">Avon Butler</option>
          </select>
        </label>

        <label>
          Field Type:
          <select id="fieldTypeSelect">
            <option value="any">Any</option>
            <option value="full">Full Field Only</option>
            <option value="half">Half Field Only</option>
          </select>
        </label>

        <label>
          Search Type:
          <select id="searchTypeSelect">
            <option value="earliest">Earliest Start After Time</option>
            <option value="exact">Available Exactly At Time</option>
          </select>
        </label>

        <label>
          Duration (minutes):
          <input type="number" id="durationInput" value="60" min="15" step="15">
        </label>

        <label>
          Start time:
          <input type="time" id="startInput" value="17:00">
        </label>

        <label>
          Day:
          <input type="date" id="dateInput">
        </label>

        <button id="searchBtn" class="primary-btn">Search</button>
      </div>

      <h2 class="section-title">Results</h2>

      <div id="results" class="results-list"></div>

    </aside>


    <!-- ========================= -->
    <!-- RIGHT: RADAR VIEW         -->
    <!-- ========================= -->
    <main id="radar-container">
      <iframe
        id="radarFrame"
        src="/haysa-scheduler-ui/field-map.html?v=20260929"
        frameborder="0"
        allowfullscreen
      ></iframe>
    </main>

  </div>

  <!-- New JS file -->
  <script src="field-search.js"></script>

</body>
</html>
