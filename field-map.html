<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HAYSA Field Usage Radar</title>

  <link rel="stylesheet" href="field-map.css" />
</head>

<body>

  <header>
    <h1>Field Usage Radar</h1>
    <div class="day-controls">
      <button id="prevDay">Prev</button>
      <span id="dayLabel"></span>
      <button id="nextDay">Next</button>
      <label>
        Date:
        <input type="date" id="radarDate">
      </label>
  
      <!-- ⭐ ADD THIS BUTTON ⭐ -->
      <button id="debugToggle">Debug</button>
    </div>
  </header>


  
  <div class="time-slider-container">
    <label for="timeSlider">Time:</label>
    <input id="timeSlider" type="range" min="0" max="1440" step="15">
    <span id="timeLabel"></span>
  </div>

  <div id="all-complexes" class="complex-grid"></div>

  <script src="field-map.js"></script>
</body>
</html>
